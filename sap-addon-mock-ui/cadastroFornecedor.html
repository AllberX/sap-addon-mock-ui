<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add-On AllberX | Cadastro de Fornecedores</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="CódigoModularizado_SóCss.css" />
</head>
<body>
  <div class="sap-header">
    <div class="container">
      <h4 class="mb-0">SAP B1 Add-On | Cadastro de Fornecedores AllberX</h4>
    </div>
  </div>

  <div class="container mt-4">
    <div class="sap-card">
      <form id="fornecedorForm" novalidate>
        <div class="mb-3">
          <label for="codigo" class="form-label">Código do Fornecedor</label>
          <input type="text" class="form-control" id="codigo" name="codigo" required maxlength="20" autocomplete="off" placeholder="Ex.: F-001" />
        </div>

        <div class="mb-3">
          <label for="nome" class="form-label">Nome do Fornecedor</label>
          <input type="text" class="form-control" id="nome" name="nome" required maxlength="100" autocomplete="organization" placeholder="Informe o nome do fornecedor" />
          <div class="invalid-feedback">O nome do fornecedor é obrigatório.</div>
        </div>

        <div class="mb-3">
          <label for="tipo" class="form-label">Tipo de Fornecedor</label>
          <select class="form-select" id="tipo" name="tipo" required>
            <option value="">Selecione...</option>
            <option value="Local">Local</option>
            <option value="Nacional">Nacional</option>
            <option value="Internacional">Internacional</option>
          </select>
        </div>

        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" id="status" name="status" />
          <label class="form-check-label" for="status">Ativo</label>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <button type="reset" class="btn btn-secondary">Limpar</button>
          <button type="button" class="btn btn-outline-danger" onclick="simularSaida()">Sair</button>
        </div>

        <div id="formFeedback" class="alert mt-3 d-none" role="alert" aria-live="polite"></div>
      </form>
    </div>

    <div class="sap-card app-list">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h5 class="mb-0">Fornecedores Cadastrados</h5>
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted small" id="countFornecedores">0 itens</span>
          <button type="button" class="btn btn-outline-danger btn-sm" id="deleteSelectedBtn">Deletar</button>
        </div>
      </div>
      <table class="table table-bordered table-striped align-middle mb-0" id="fornecedorTable">
        <thead>
          <tr>
            <th scope="col" class="text-center">Sel.</th>
            <th scope="col">Código</th>
            <th scope="col">Nome</th>
            <th scope="col">Tipo</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="CódigoModularizado_SóJavaScript.js"></script>
</body>
</html>
