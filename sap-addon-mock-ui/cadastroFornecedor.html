<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add-On AllberX | Cadastro de Fornecedores</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Estilos personalizados -->
  <style>
    body {
      background-color: #f8f9fa;
    }

    .sap-header {
      background-color: #003366;
      color: white;
      padding: 10px 20px;
    }

    .sap-card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-label {
      font-weight: 600;
    }

    .app-list {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="sap-header">
    <h4>SAP B1 Add-On | Cadastro de Fornecedores AllberX</h4>
  </div>

  <div class="container mt-4">
    <div class="sap-card">
      <form id="fornecedorForm">
        <div class="mb-3">
          <label for="codigo" class="form-label">Código do Fornecedor</label>
          <input type="text" class="form-control" id="codigo" required />
        </div>

        <div class="mb-3">
          <label for="nome" class="form-label">Nome do Fornecedor</label>
          <input type="text" class="form-control" id="nome" required />
        </div>

        <div class="mb-3">
          <label for="tipo" class="form-label">Tipo de Fornecedor</label>
          <select class="form-select" id="tipo" required>
            <option value="">Selecione...</option>
            <option value="Local">Local</option>
            <option value="Nacional">Nacional</option>
            <option value="Internacional">Internacional</option>
          </select>
        </div>

        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" id="status" />
          <label class="form-check-label" for="status">Ativo</label>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="reset" class="btn btn-secondary ms-2">Limpar</button>
        <button type="button" class="btn btn-danger ms-2" onclick="simularSaida()">Sair</button>
      </form>
    </div>

    <!-- Lista de fornecedores -->
    <div class="sap-card app-list">
      <h5>Fornecedores Cadastrados</h5>
      <table class="table table-bordered table-striped mt-3" id="fornecedorTable">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Itens preenchidos dinamicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Script principal -->
  <script>
    const form = document.getElementById("fornecedorForm");
    const tableBody = document.querySelector("#fornecedorTable tbody");

    document.addEventListener("DOMContentLoaded", loadFornecedores);

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const codigo = document.getElementById("codigo").value.trim();
      const nome = document.getElementById("nome").value.trim();
      const tipo = document.getElementById("tipo").value;
      const status = document.getElementById("status").checked ? "Ativo" : "Inativo";

      if (!codigo || !nome || !tipo) {
        alert("Por favor, preencha todos os campos obrigatórios.");
        return;
      }

      const newFornecedor = { codigo, nome, tipo, status };
      const fornecedores = JSON.parse(localStorage.getItem("fornecedores")) || [];

      fornecedores.push(newFornecedor);
      localStorage.setItem("fornecedores", JSON.stringify(fornecedores));

      alert("Fornecedor salvo com sucesso!");
      form.reset();
      loadFornecedores();
    });

    function loadFornecedores() {
      const fornecedores = JSON.parse(localStorage.getItem("fornecedores")) || [];
      tableBody.innerHTML = "";

      fornecedores.forEach((fornecedor) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${fornecedor.codigo}</td>
          <td>${fornecedor.nome}</td>
          <td>${fornecedor.tipo}</td>
          <td>${fornecedor.status}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function simularSaida() {
      if (confirm("Deseja realmente sair?")) {
        alert("Simulação de saída realizada!");
      }
    }
  </script>
</body>
</html>
