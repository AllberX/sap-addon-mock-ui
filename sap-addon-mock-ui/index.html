<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add-On AllberX</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Estilos personalizados -->
  <style>
    body {
      background-color: #f8f9fa;
    }

    .sap-header {
      background-color: #003366;
      color: white;
      padding: 10px 20px;
    }

    .sap-card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-label {
      font-weight: 600;
    }

    .app-list {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="sap-header">
    <h4>SAP B1 Add-On | Cadastro de Aplicações AllberX</h4>
  </div>

  <div class="container mt-4">
    <div class="sap-card">
      <form id="applicationForm">
        <div class="mb-3">
          <label for="codigo" class="form-label">Código da Aplicação</label>
          <input type="text" class="form-control" id="codigo" required />
        </div>

        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <input type="text" class="form-control" id="descricao" required />
        </div>

        <div class="mb-3">
          <label for="tipo" class="form-label">Tipo de Aplicação</label>
          <select class="form-select" id="tipo" required>
            <option value="">Selecione...</option>
            <option value="Web">Web</option>
            <option value="Desktop">Desktop</option>
            <option value="Mobile">Mobile</option>
          </select>
        </div>

        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" id="status" />
          <label class="form-check-label" for="status">Ativo</label>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="reset" class="btn btn-secondary ms-2">Limpar</button>
        <button type="button" class="btn btn-danger ms-2" onclick="simularSaida()">Sair</button>
      </form>
    </div>

    <!-- Lista de aplicações -->
    <div class="sap-card app-list">
      <h5>Aplicações Cadastradas</h5>
      <table class="table table-bordered table-striped mt-3" id="appTable">
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Tipo</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Itens preenchidos dinamicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Script principal -->
  <script>
    const form = document.getElementById("applicationForm");
    const appTableBody = document.querySelector("#appTable tbody");

    document.addEventListener("DOMContentLoaded", loadApplications);

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const codigo = document.getElementById("codigo").value.trim();
      const descricao = document.getElementById("descricao").value.trim();
      const tipo = document.getElementById("tipo").value;
      const status = document.getElementById("status").checked ? "Ativo" : "Inativo";

      if (!codigo || !descricao || !tipo) {
        alert("Por favor, preencha todos os campos obrigatórios.");
        return;
      }

      const newApp = { codigo, descricao, tipo, status };
      const apps = JSON.parse(localStorage.getItem("apps")) || [];

      apps.push(newApp);
      localStorage.setItem("apps", JSON.stringify(apps));

      alert("Aplicação salva com sucesso!");
      form.reset();
      loadApplications();
    });

    function loadApplications() {
      const apps = JSON.parse(localStorage.getItem("apps")) || [];
      appTableBody.innerHTML = "";

      apps.forEach((app) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${app.codigo}</td>
          <td>${app.descricao}</td>
          <td>${app.tipo}</td>
          <td>${app.status}</td>
        `;
        appTableBody.appendChild(row);
      });
    }

    function simularSaida() {
      if (confirm("Deseja realmente sair?")) {
        alert("Simulação de saída realizada!");
      }
    }
  </script>
</body>
</html>
